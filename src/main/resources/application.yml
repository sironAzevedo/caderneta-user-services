server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 30
      min-spare: 5
    max-connections: 100
    accept-count: 50

spring:
  application:
    name: user-services
  jpa:
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}
        temp:
          use_jdbc_metadata_defaults: false

database:
  enabled: true
  url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/usuario_db}
  driver-class-name: org.postgresql.Driver
  user: ${DATABASE_USER:fatura_user}
  pass: ${DATABASE_PASS:fatura_user}
  default-schema: ${DATABASE_SCHEMA:public}

message:
  baseName: message

security:
  enabled: ${SECURITY_ENABLE:true}
  scopes: ${APP_SCOPES:users}

cloud:
  aws:
    services: s3, s3presigner
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_BUCKET_NAME:caderneta-service-image-prod}

avatar:
  base-url: ${AVATAR_BASE_URL:https://${cloud.aws.s3.bucket}.s3.${cloud.aws.region.static}.amazonaws.com/}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

cache:
  redis:
    config:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
    caches:
      - cacheName: user_services_cliente_por_email
        expiration: ${CACHE_DURATION_CONSULTA_PESSOA_EMAIL:PT72H}
      - cacheName: user_services_cliente_login_email
        expiration: ${CACHE_DURATION_CONSULTA_LOGIN_EMAIL:PT72H}
      - cacheName: user_services_cliente_por_id
        expiration: ${CACHE_DURATION_CONSULTA_PESSOA_ID:PT72H}
